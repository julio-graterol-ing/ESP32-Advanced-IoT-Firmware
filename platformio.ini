; PlatformIO Project Configuration File
; Phase 2: ESP32 IoT Cloud Architecture - Day 2 / Session 2

[env:esp32dev]
platform = espressif32@^6.5.0           ; Core industrial Espressif 32-bit driver platform
board = esp32dev                        ; Hardware registers abstraction layer for WROOM-32
framework = arduino                     ; Framework core layer for 32-bit registers
monitor_speed = 115200                  ; Native high-speed serial baud rate for ESP32 metrics
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
    ESP32Async/ESPAsyncWebServer @ ^3.6.0  
    ESP32Async/AsyncTCP @ ^3.3.2                    
